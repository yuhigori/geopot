<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEO-POT 管理画面</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap"
        rel="stylesheet">

    <style>
        body {
            font-family: 'Noto Sans JP', sans-serif;
        }

        .loader {
            border-top-color: #10b981;
            -webkit-animation: spinner 1.5s linear infinite;
            animation: spinner 1.5s linear infinite;
        }

        @keyframes spinner {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body class="bg-slate-100 text-slate-800 antialiased h-screen flex overflow-hidden">

    <!-- LOGIN OVERLAY -->
    <div id="login-overlay" class="fixed inset-0 bg-slate-900 z-[100] flex flex-col items-center justify-center p-4">
        <div class="w-full max-w-md bg-white rounded-xl shadow-2xl p-8 text-center animate-fade-in">
            <div
                class="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-6 text-slate-800 text-2xl">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h1 class="text-2xl font-bold text-slate-900 mb-2">管理者ログイン</h1>
            <p class="text-slate-500 mb-6 text-sm">パスワードを入力してください。</p>

            <form id="login-form" class="space-y-4" onsubmit="handleLogin(event)">
                <div>
                    <input type="password" id="password-input" placeholder="Password"
                        class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition"
                        required>
                </div>
                <button type="submit"
                    class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-lg shadow-lg transition transform active:scale-95">
                    ロック解除
                </button>
                <p id="login-error" class="text-red-500 text-sm hidden mt-2"><i
                        class="fa-solid fa-circle-exclamation mr-1"></i> パスワードが間違っています</p>
            </form>
        </div>
        <p class="text-slate-500 mt-8 text-xs">Default Password: <code>admin123</code></p>
    </div>

    <!-- SIDEBAR -->
    <aside class="w-64 bg-slate-900 text-white hidden md:flex flex-col flex-shrink-0 transition-all duration-300"
        id="sidebar">
        <div class="p-6 border-b border-slate-800 flex items-center justify-between">
            <span class="font-bold text-xl tracking-tight">GEO-POT Admin</span>
        </div>

        <nav class="flex-1 p-4 space-y-2 overflow-y-auto">
            <a href="#" onclick="switchTab('add')" id="nav-add"
                class="flex items-center space-x-3 px-4 py-3 rounded-lg bg-emerald-600 text-white shadow-md transition">
                <i class="fa-solid fa-plus-circle w-5 text-center"></i>
                <span>新規商品登録</span>
            </a>
            <a href="#" onclick="switchTab('list')" id="nav-list"
                class="flex items-center space-x-3 px-4 py-3 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white transition">
                <i class="fa-solid fa-list w-5 text-center"></i>
                <span>商品リスト</span>
            </a>
            <div class="pt-4 mt-4 border-t border-slate-800">
                <a href="index.html" target="_blank"
                    class="flex items-center space-x-3 px-4 py-3 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white transition">
                    <i class="fa-solid fa-external-link-alt w-5 text-center"></i>
                    <span>サイトを確認</span>
                </a>
            </div>
        </nav>

        <div class="p-4 border-t border-slate-800">
            <button onclick="logout()"
                class="flex items-center space-x-3 px-4 py-2 w-full text-slate-400 hover:text-white hover:bg-slate-800 rounded-lg transition">
                <i class="fa-solid fa-right-from-bracket"></i>
                <span>ログアウト</span>
            </button>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="flex-1 flex flex-col min-w-0 overflow-hidden bg-slate-50 relative">
        <header class="md:hidden bg-white border-b border-slate-200 p-4 flex items-center justify-between z-20">
            <span class="font-bold text-lg text-slate-900">GEO-POT Admin</span>
        </header>

        <div class="flex-1 overflow-y-auto p-4 sm:p-8" id="main-scroll">

            <!-- TAB: ADD PRODUCT -->
            <div id="tab-add" class="max-w-5xl mx-auto animate-fade-in">
                <h2 class="text-2xl font-bold text-slate-900 mb-6 flex items-center">
                    <span
                        class="bg-emerald-100 text-emerald-600 w-10 h-10 rounded-full flex items-center justify-center mr-3 text-lg"><i
                            class="fa-solid fa-pen"></i></span>
                    新規商品の登録
                </h2>

                <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                    <!-- Form -->
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                        <form id="product-form" onsubmit="addProduct(event)" class="space-y-5">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-sm font-medium text-slate-700 mb-1">商品ID (Slug)</label>
                                    <input type="text" name="id" placeholder="例: standard-white"
                                        class="w-full rounded-md border-slate-300 shadow-sm border p-2" required
                                        oninput="updatePreview()">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-slate-700 mb-1">商品名</label>
                                    <input type="text" name="title" placeholder="例: GEO-POT Standard"
                                        class="w-full rounded-md border-slate-300 shadow-sm border p-2" required
                                        oninput="updatePreview()">
                                </div>
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-sm font-medium text-slate-700 mb-1">価格 (税込)</label>
                                    <input type="text" name="price" placeholder="例: ¥3,500"
                                        class="w-full rounded-md border-slate-300 shadow-sm border p-2" required
                                        oninput="updatePreview()">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-slate-700 mb-1">バッジ (任意)</label>
                                    <input type="text" name="badge" placeholder="例: Best Seller"
                                        class="w-full rounded-md border-slate-300 shadow-sm border p-2"
                                        oninput="updatePreview()">
                                </div>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">商品画像URL</label>
                                <input type="url" name="image" id="image-input" placeholder="https://..."
                                    class="w-full rounded-md border-slate-300 shadow-sm border p-2" required
                                    oninput="updatePreview()">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">商品説明</label>
                                <textarea name="desc" rows="3"
                                    class="w-full rounded-md border-slate-300 shadow-sm border p-2" required
                                    oninput="updatePreview()"></textarea>
                            </div>
                            <div class="bg-slate-50 p-4 rounded-lg border border-slate-200 space-y-3">
                                <h3 class="text-xs font-bold text-slate-500 uppercase">スペック詳細</h3>
                                <div class="grid grid-cols-2 gap-3">
                                    <input type="text" name="spec_size" placeholder="サイズ"
                                        class="w-full rounded border-slate-300 text-sm border p-1"
                                        oninput="updatePreview()">
                                    <input type="text" name="spec_weight" placeholder="重量"
                                        class="w-full rounded border-slate-300 text-sm border p-1"
                                        oninput="updatePreview()">
                                    <input type="text" name="spec_rec" placeholder="推奨ポット"
                                        class="col-span-2 w-full rounded border-slate-300 text-sm border p-1"
                                        oninput="updatePreview()">
                                </div>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Stripe コード
                                    (埋め込みコード)</label>
                                <textarea name="stripe_code" rows="4"
                                    placeholder='<script async src="..."></script> <stripe-buy-button ...>'
                                    class="w-full rounded-md border-slate-300 shadow-sm border p-2" required></textarea>
                                <p class="text-xs text-slate-500 mt-1">Stripeダッシュボードから取得した「利用ボタン」のコードを貼り付けてください。</p>
                            </div>
                            <div class="pt-4 flex items-center justify-between">
                                <span id="status-msg" class="text-sm font-medium text-emerald-600 hidden"><i
                                        class="fa-solid fa-check"></i> 保存しました</span>
                                <button type="submit" id="submit-btn"
                                    class="bg-slate-900 py-3 px-8 text-sm font-medium text-white rounded-md hover:bg-slate-800 transition">登録する</button>
                            </div>
                        </form>
                    </div>

                    <!-- Preview -->
                    <div class="flex flex-col gap-6">
                        <h3 class="text-sm font-bold text-slate-500 uppercase tracking-wider">PREVIEW</h3>
                        <div class="w-full max-w-sm mx-auto bg-white rounded-2xl shadow-xl overflow-hidden group">
                            <div class="relative overflow-hidden aspect-square bg-gray-100">
                                <span id="preview-badge"
                                    class="absolute top-4 left-4 z-10 bg-emerald-600 text-white text-xs font-bold px-3 py-1 rounded-full hidden"></span>
                                <img id="preview-image" src="https://via.placeholder.com/400x400?text=No+Image"
                                    class="w-full h-full object-cover">
                            </div>
                            <div class="p-6 flex flex-col">
                                <h3 id="preview-title" class="text-lg font-bold text-slate-900 mb-2">Product Name</h3>
                                <p id="preview-desc" class="text-sm text-slate-500 mb-4 line-clamp-2">...</p>
                                <span id="preview-price" class="text-xl font-bold text-slate-900">¥0</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- TAB: LIST -->
            <div id="tab-list" class="max-w-6xl mx-auto hidden animate-fade-in">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold text-slate-900 flex items-center">
                        <span
                            class="bg-blue-100 text-blue-600 w-10 h-10 rounded-full flex items-center justify-center mr-3 text-lg"><i
                                class="fa-solid fa-database"></i></span>
                        登録済み商品一覧
                    </h2>
                    <button onclick="fetchProducts()"
                        class="text-sm text-slate-500 hover:text-emerald-600 underline">データ更新</button>
                </div>
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                    <table class="min-w-full divide-y divide-slate-200">
                        <thead class="bg-slate-50">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase">商品</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase">価格</th>
                                <th class="px-6 py-3 text-right text-xs font-medium text-slate-500 uppercase">操作</th>
                            </tr>
                        </thead>
                        <tbody id="product-table-body" class="bg-white divide-y divide-slate-200"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Config Logic for Canvas vs Production
        let firebaseConfig;
        let appId;

        if (typeof __firebase_config !== 'undefined') {
            // 現在のプレビュー環境用（このまま触らないでください）
            firebaseConfig = JSON.parse(__firebase_config);
            appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        } else {
            // ★★★ここにFirebaseの設定を貼り付けてください（外部公開用）★★★
            // Firebaseコンソール > プロジェクトの設定 > 全般 > マイアプリ で取得したコードの中身
            // Import the functions you need from the SDKs you need
            import { initializeApp } from "firebase/app";
            // TODO: Add SDKs for Firebase products that you want to use
            // https://firebase.google.com/docs/web/setup#available-libraries

            // Your web app's Firebase configuration
            const firebaseConfig = {
                apiKey: "AIzaSyCtcrcIUkcUGKycL656uAZMgy8Cysz6Cgw",
                authDomain: "geo-pot-8b9c7.firebaseapp.com",
                projectId: "geo-pot-8b9c7",
                storageBucket: "geo-pot-8b9c7.firebasestorage.app",
                messagingSenderId: "495377899604",
                appId: "1:495377899604:web:6e48f00e5e69600fe7cdc1"
            };
        }

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // パス設定: プレビュー環境と本番環境で切り替え
        function getCollectionRef() {
            if (typeof __firebase_config !== 'undefined') {
                return collection(db, 'artifacts', appId, 'public', 'data', 'products');
            } else {
                return collection(db, 'products');
            }
        }

        let currentUser = null;

        // 認証ロジック
        async function initAuth() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (e) {
                console.error("Auth Error:", e);
                if (typeof __firebase_config === 'undefined') alert("Firebase接続エラー: 設定を確認してください");
            }
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                console.log("Admin Logged in as:", user.uid);
            }
        });

        initAuth();

        window.addProduct = async (e) => {
            e.preventDefault();
            if (!currentUser) return alert("認証エラー: ログインしていません。ページを再読み込みしてください。");
            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.innerText = '保存中...';

            const formData = new FormData(e.target);
            const stripeCode = formData.get('stripe_code');
            let buyButtonId = '';
            let publishableKey = '';

            if (stripeCode) {
                const idMatch = stripeCode.match(/buy-button-id="([^"]+)"/);
                if (idMatch) buyButtonId = idMatch[1];

                const keyMatch = stripeCode.match(/publishable-key="([^"]+)"/);
                if (keyMatch) publishableKey = keyMatch[1];
            }

            const productData = {
                id: formData.get('id'),
                title: formData.get('title'),
                price: formData.get('price'),
                badge: formData.get('badge') || null,
                image: formData.get('image'),
                desc: formData.get('desc'),
                specs: {
                    size: formData.get('spec_size'),
                    weight: formData.get('spec_weight'),
                    rec: formData.get('spec_rec')
                },
                stripeBuyButtonId: buyButtonId,
                stripePublishableKey: publishableKey,
                createdAt: serverTimestamp()
            };

            try {
                await addDoc(getCollectionRef(), productData);
                document.getElementById('status-msg').classList.remove('hidden');
                e.target.reset();
                updatePreview();
                setTimeout(() => document.getElementById('status-msg').classList.add('hidden'), 3000);
            } catch (error) {
                alert("エラー: " + error.message);
                console.error(error);
            } finally {
                btn.disabled = false;
                btn.innerText = '登録する';
            }
        };

        window.fetchProducts = async () => {
            const tbody = document.getElementById('product-table-body');
            tbody.innerHTML = '<tr><td colspan="3" class="text-center py-4">読み込み中...</td></tr>';

            // 認証完了を少し待つ（簡易対応）
            if (!currentUser) await new Promise(r => setTimeout(r, 1000));

            try {
                const q = query(getCollectionRef(), orderBy('createdAt', 'desc'));
                const querySnapshot = await getDocs(q);
                tbody.innerHTML = '';

                if (querySnapshot.empty) {
                    tbody.innerHTML = '<tr><td colspan="3" class="text-center py-4 text-slate-500">データがありません</td></tr>';
                    return;
                }

                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td class="px-6 py-4 flex items-center"><img src="${data.image}" class="h-10 w-10 rounded-full mr-4 object-cover"><div class="text-sm font-medium">${data.title}</div></td>
                        <td class="px-6 py-4 text-sm">${data.price}</td>
                        <td class="px-6 py-4 text-right"><button onclick="deleteProduct('${docSnap.id}')" class="text-red-600 hover:text-red-900"><i class="fa-solid fa-trash-can"></i></button></td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                console.error(error);
                tbody.innerHTML = `<tr><td colspan="3" class="text-center text-red-500">読み込みエラー: ${error.message}</td></tr>`;
            }
        };

        window.deleteProduct = async (docId) => {
            if (!confirm("削除しますか？")) return;
            try {
                await deleteDoc(doc(getCollectionRef(), docId));
                fetchProducts();
            } catch (error) {
                alert("削除エラー: " + error.message);
            }
        }
    </script>

    <script>
        function handleLogin(e) {
            e.preventDefault();
            if (document.getElementById('password-input').value === 'admin123') {
                document.getElementById('login-overlay').classList.add('hidden');
            } else {
                document.getElementById('login-error').classList.remove('hidden');
            }
        }
        function logout() { location.reload(); }
        function switchTab(tabName) {
            document.getElementById('tab-add').classList.add('hidden');
            document.getElementById('tab-list').classList.add('hidden');
            document.getElementById('nav-add').classList.remove('bg-emerald-600', 'text-white');
            document.getElementById('nav-list').classList.remove('bg-emerald-600', 'text-white');

            document.getElementById('tab-' + tabName).classList.remove('hidden');
            document.getElementById('nav-' + tabName).classList.add('bg-emerald-600', 'text-white');
            if (tabName === 'list') window.fetchProducts();
        }
        function updatePreview() {
            const form = document.getElementById('product-form');
            const fd = new FormData(form);
            document.getElementById('preview-title').innerText = fd.get('title') || 'Product Name';
            document.getElementById('preview-price').innerText = fd.get('price') || '¥0';
            document.getElementById('preview-desc').innerText = fd.get('desc') || '...';
            document.getElementById('preview-image').src = fd.get('image') || 'https://via.placeholder.com/400x400';
            const badge = fd.get('badge');
            const badgeEl = document.getElementById('preview-badge');
            if (badge) { badgeEl.innerText = badge; badgeEl.classList.remove('hidden'); }
            else { badgeEl.classList.add('hidden'); }
        }
    </script>
</body>

</html>
